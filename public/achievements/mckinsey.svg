<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="mckBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E231C" />
      <stop offset="50%" stop-color="#16382E" />
      <stop offset="100%" stop-color="#245142" />
    </linearGradient>
    <pattern id="mckGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#mckBg)" />
  <rect width="1200" height="750" fill="url(#mckGrid)" />
  <circle cx="200" cy="200" r="280" fill="#D4A843" opacity="0.08" filter="blur(60px)" />

  <g transform="translate(100, 120)">
    <rect x="0" y="0" width="180" height="36" rx="18" fill="rgba(212,168,67,0.15)" stroke="#D4A843" stroke-opacity="0.4" />
    <text x="90" y="23" fill="#D4A843" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="2">EXECUTIVE LEARNING</text>

    <text x="0" y="110" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="50" font-weight="700" letter-spacing="-1">McKinsey.org Forward</text>
    <text x="0" y="165" fill="#D4A843" font-family="system-ui, sans-serif" font-size="34" font-weight="400" font-style="italic">Leadership, Problem Solving & Agile Digital Mindset</text>

    <text x="0" y="240" fill="#A0A59D" font-family="system-ui, sans-serif" font-size="20" font-weight="400">Structured problem solving, practical business communication and agile adaptation</text>

    <g transform="translate(0, 310)">
      <rect x="0" y="0" width="280" height="130" rx="20" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
      <text x="30" y="55" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="36" font-weight="700">3 Mos</text>
      <text x="30" y="90" fill="#D4A843" font-family="system-ui, sans-serif" font-size="14" font-weight="500">PROGRAM DURATION</text>

      <rect x="310" y="0" width="280" height="130" rx="20" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
      <text x="340" y="55" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="36" font-weight="700">Global</text>
      <text x="340" y="90" fill="#D4A843" font-family="system-ui, sans-serif" font-size="14" font-weight="500">EXCELLENCE STANDARD</text>

      <rect x="620" y="0" width="280" height="130" rx="20" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
      <text x="650" y="55" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="36" font-weight="700">Verified</text>
      <text x="650" y="90" fill="#D4A843" font-family="system-ui, sans-serif" font-size="14" font-weight="500">OFFICIAL CREDENTIAL</text>
    </g>
